<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue Dependency Graph</title>
<style>
:root{
  color-scheme:dark;
  --bg:#05070d;--panel:rgba(10,16,30,.72);--panel-solid:#0a1020;--inset:#060a14;
  --border:rgba(56,189,248,.18);--border-hi:rgba(56,189,248,.45);
  --text:#d7e7ff;--muted:#7d8fb0;--dim:#4a5a78;
  --cyan:#22d3ee;--violet:#a78bfa;--magenta:#ff3d81;--amber:#fbbf24;--green:#34d399;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --glow:0 0 0 1px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.25);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--text);font:14px/1.5 var(--sans);
  background:
    radial-gradient(1100px 560px at 85% -12%,rgba(167,139,250,.14),transparent 60%),
    radial-gradient(900px 520px at -10% 110%,rgba(34,211,238,.10),transparent 60%),
    linear-gradient(rgba(56,189,248,.045) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,rgba(56,189,248,.045) 1px,transparent 1px) 0 0/32px 32px,
    var(--bg);
  background-attachment:fixed}
::selection{background:rgba(34,211,238,.35)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(56,189,248,.22);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(56,189,248,.4)}
*{scrollbar-color:rgba(56,189,248,.25) transparent;scrollbar-width:thin}

/* ---------- header ---------- */
header{position:relative;padding:16px 20px 14px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(10,16,30,.92),rgba(10,16,30,.65));backdrop-filter:blur(10px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan) 20%,var(--violet) 60%,transparent);opacity:.7}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;flex:none;border:1px solid var(--border-hi);border-radius:8px;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(34,211,238,.25),transparent 70%);box-shadow:var(--glow)}
.kicker{font:600 10px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--cyan);opacity:.85}
h1{font:600 18px/1.2 var(--sans);margin:4px 0 0;letter-spacing:.01em;
  background:linear-gradient(90deg,#e8f6ff,#9fe8ff 55%,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.stat{min-width:92px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:rgba(6,10,20,.6);position:relative}
.stat b{display:block;font:600 18px/1.1 var(--mono);color:var(--text);font-variant-numeric:tabular-nums}
.stat span{font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.stat::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--c,var(--cyan));box-shadow:0 0 10px var(--c,var(--cyan))}
.stat.s-blocked{--c:var(--magenta)}.stat.s-ready{--c:var(--amber)}.stat.s-edges{--c:var(--violet)}

form{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:5px;font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
label.chk{flex-direction:row;align-items:center;gap:7px;font:13px/1.2 var(--sans);letter-spacing:0;text-transform:none;color:var(--text);
  padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(6,10,20,.5);cursor:pointer;transition:border-color .15s,box-shadow .15s}
label.chk:hover{border-color:var(--border-hi)}
label.chk:has(input:checked){border-color:rgba(34,211,238,.55);box-shadow:inset 0 0 12px rgba(34,211,238,.12)}
input[type=checkbox]{accent-color:var(--cyan);margin:0}
input[type=text],input[type=password],select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--inset);color:var(--text);
  font:13px/1.2 var(--mono);min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--dim)}
input:focus,select:focus{border-color:var(--cyan);box-shadow:var(--glow)}
select option{background:var(--panel-solid)}
#repo{width:320px}#token{width:250px}#focus{width:80px}
button{padding:8px 13px;border:1px solid var(--border-hi);border-radius:8px;background:rgba(34,211,238,.06);color:#bdefff;
  font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s,box-shadow .15s,transform .05s}
button:hover:not(:disabled){background:rgba(34,211,238,.14);box-shadow:var(--glow)}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible{outline:none;box-shadow:var(--glow)}
button.primary{border:0;color:#03121a;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 22px rgba(34,211,238,.35)}
button.primary:hover:not(:disabled){background:linear-gradient(90deg,#5ee7f7,#c4b5fd);box-shadow:0 0 28px rgba(167,139,250,.5)}
button:disabled{opacity:.35;cursor:default}

#status{padding:9px 20px;color:var(--muted);min-height:22px;font:12px/1.5 var(--mono)}
#status:not(:empty)::before{content:"› ";color:var(--cyan)}
#status.err{color:#ff8db4}#status.err::before{color:var(--magenta)}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;padding:0 20px 20px}
@media (max-width:960px){main{grid-template-columns:1fr}#repo{width:100%}}
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(8px);overflow:hidden}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border-color:var(--cyan);opacity:.75}
.card::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid;border-top-left-radius:12px}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid;border-bottom-right-radius:12px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:9px 10px;border-bottom:1px solid var(--border);align-items:center;background:rgba(6,10,20,.35)}
.toolbar .sp{flex:1}
.toolbar button{padding:7px 10px}
#graph{overflow:auto;height:calc(100vh - 262px);min-height:380px;padding:18px;
  background:radial-gradient(ellipse at center,rgba(34,211,238,.05),transparent 70%)}
#graph svg{display:block;margin:auto}

.legend{display:flex;gap:14px;flex-wrap:wrap;font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:0 0 8px var(--c)}
.l-blocked{--c:var(--magenta)}.l-ready{--c:var(--amber)}.l-open{--c:#38bdf8}.l-done{--c:var(--green)}

aside{display:flex;flex-direction:column;gap:14px;min-width:0}
aside h2{display:flex;align-items:center;gap:8px;margin:0;padding:12px 14px;border-bottom:1px solid var(--border);
  font:600 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:#bdefff}
aside h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--cyan));box-shadow:0 0 10px var(--c,var(--cyan))}
#hBlocked{--c:var(--magenta)}#hReady{--c:var(--amber)}
aside ul{list-style:none;margin:0;padding:6px;max-height:31vh;overflow:auto}
aside li{padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.35;transition:background .15s}
aside li:hover{background:rgba(34,211,238,.06)}
aside .meta{color:var(--muted);font:11px/1.5 var(--mono);margin-top:3px}
a{color:#7dd3fc;text-decoration:none}a:hover{color:#bdefff;text-shadow:0 0 10px rgba(34,211,238,.6)}
textarea{display:block;width:100%;height:170px;border:0;background:var(--inset);color:#9fe8ff;font:12px/1.5 var(--mono);padding:10px 12px;resize:vertical;outline:none}
details summary{cursor:pointer;padding:12px 14px;font:600 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:#bdefff;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";color:var(--cyan)}details[open] summary::before{content:"▾ "}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;height:100%;min-height:320px;color:var(--muted);text-align:center;font:12.5px/1.8 var(--mono)}
.empty .radar{width:96px;height:96px;border-radius:50%;border:1px solid var(--border-hi);position:relative;
  background:repeating-radial-gradient(circle,transparent 0 15px,rgba(34,211,238,.14) 15px 16px);box-shadow:var(--glow)}
.empty .radar::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(34,211,238,.55),transparent 22%);animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- graph (Mermaid SVG) ---------- */
#graph .node rect,#graph .node polygon,#graph .node path{rx:7px;ry:7px;transition:filter .15s}
#graph .node.blocked rect{filter:drop-shadow(0 0 6px rgba(255,61,129,.55))}
#graph .node.ready rect{filter:drop-shadow(0 0 6px rgba(251,191,36,.5))}
#graph .node.open rect{filter:drop-shadow(0 0 4px rgba(56,189,248,.3))}
#graph .node.done rect{filter:drop-shadow(0 0 3px rgba(52,211,153,.25));opacity:.8}
#graph .node.clickable{cursor:pointer}
#graph .node:hover rect{filter:brightness(1.35) drop-shadow(0 0 10px rgba(34,211,238,.7))}
#graph .nodeLabel{font-family:var(--mono)!important}
#graph .nodeLabel small{opacity:.65;font-size:11px}
#graph .nodeLabel b{color:#fff;font-weight:700}
#graph .flowchart-link{stroke:var(--cyan)!important;stroke-width:1.6px!important;filter:drop-shadow(0 0 3px rgba(34,211,238,.55))}
#graph .flowchart-link.edge-pattern-solid{stroke-dasharray:7 5;animation:flow 1.1s linear infinite}
#graph .flowchart-link.edge-pattern-dotted{stroke:#3b4a66!important;filter:none}
#graph marker path,#graph .marker{fill:var(--cyan)!important;stroke:var(--cyan)!important}
#graph .edgeLabel,#graph .edgeLabel p,#graph .edgeLabel span{background-color:#0a1222!important;color:#7dd3fc!important;font:10.5px var(--mono)!important}
#graph .edgeLabel rect,#graph .labelBkg{fill:#0a1222!important;background-color:#0a1222!important}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){#graph .flowchart-link.edge-pattern-solid,.empty .radar::after{animation:none}}
</style>

<body>
<header>
  <div class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M7 7.2 10.6 16M17 7.2 13.4 16M7.2 6h9.6"/></svg></div>
      <div><div class="kicker">Dependency radar</div><h1>GitHub issue dependency graph</h1></div>
    </div>
    <div class="hud" aria-label="Summary">
      <div class="stat"><b id="sIssues">—</b><span>Issues</span></div>
      <div class="stat s-blocked"><b id="sBlocked">—</b><span>Blocked</span></div>
      <div class="stat s-ready"><b id="sReady">—</b><span>Unblockers</span></div>
      <div class="stat s-edges"><b id="sEdges">—</b><span>Links</span></div>
    </div>
  </div>
  <form id="f">
    <label class="live">Repository (owner/repo)<input type="text" id="repo" placeholder="org/repo or repository URL" required></label>
    <label class="live">GitHub token<input type="password" id="token" placeholder="github_pat_… or output of: gh auth token" required autocomplete="off"></label>
    <label class="chk live"><input type="checkbox" id="remember"> remember in this browser</label>
    <label>Direction<select id="dir"><option value="LR">→ horizontal</option><option value="TD">↓ vertical</option></select></label>
    <label class="chk"><input type="checkbox" id="openOnly" checked> open only</label>
    <label class="chk"><input type="checkbox" id="linkedOnly" checked> only issues with dependencies</label>
    <label class="chk"><input type="checkbox" id="parseText" checked> also read “Depends on / Blocked by” from descriptions</label>
    <label>Focus on #<input type="text" id="focus" placeholder="e.g. 42"></label>
    <button class="primary live" id="go" type="submit">Fetch &amp; draw</button>
    <button type="button" id="redraw" disabled>Redraw</button>
  </form>
</header>
<div id="status"></div>
<main>
  <section class="card">
    <div class="toolbar">
      <div class="legend"><span class="l-blocked">blocked</span><span class="l-ready">unblocks others</span><span class="l-open">open</span><span class="l-done">closed</span></div>
      <div class="sp"></div>
      <button type="button" id="zout">−</button><button type="button" id="zfit">Fit</button><button type="button" id="zin">+</button>
      <button type="button" id="dlsvg" disabled>Download SVG</button>
    </div>
    <div id="graph"><div class="empty"><div class="radar" aria-hidden="true"></div><div>Awaiting data. Enter a repository and token, then <b>Fetch &amp; draw</b>.<br>A → B means A blocks B. Click a node to open the issue.</div></div></div>
  </section>
  <aside>
    <div class="card"><h2 id="hBlocked">Blocked</h2><ul id="lBlocked"><li class="meta">—</li></ul></div>
    <div class="card"><h2 id="hReady">Do these first</h2><ul id="lReady"><li class="meta">—</li></ul></div>
    <div class="card"><details><summary>Mermaid source</summary>
      <div class="toolbar"><button type="button" id="copy">Copy</button></div>
      <textarea id="src" readonly></textarea></details></div>
  </aside>
</main>
<!-- Data injected by issue-graph.sh (gh mode). Do not change this line. -->
<script type="application/json" id="embedded">null</script>
<script>
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
let issuesCache=null, repoCache='', zoom=1, seq=0;

// --- init form ---
$('repo').value=store.get('ig.repo')||'';
const savedTok=store.get('ig.token'); if(savedTok){$('token').value=savedTok;$('remember').checked=true;}
['dir','openOnly','linkedOnly','parseText'].forEach(id=>{const v=store.get('ig.'+(id==='parseText'?'parseText2':id)); if(v!=null){ if($(id).type==='checkbox')$(id).checked=v==='1'; else $(id).value=v; }});

function setStatus(msg,err){const s=$('status');s.textContent=msg;s.className=err?'err':'';}

function buildQuery(withDeps){return `query($owner:String!,$name:String!,$cursor:String,$states:[IssueState!]){
  repository(owner:$owner,name:$name){
    issues(first:100,after:$cursor,states:$states,orderBy:{field:CREATED_AT,direction:ASC}){
      pageInfo{hasNextPage endCursor}
      nodes{
        number title state url body
        assignees(first:2){nodes{login}}
        ${withDeps?'blockedBy(first:50){nodes{number title state url repository{nameWithOwner}}}':''}
      }
    }
  }
}`;}

// Accepts: org/repo, https://github.com/org/repo, https://github.example.com/org/repo[/issues…]
function parseRepoInput(raw){
  let s=String(raw).trim().replace(/^https?:\/\//i,'').replace(/[?#].*$/,'').replace(/\.git$/,'').replace(/\/+$/,'');
  const parts=s.split('/').filter(Boolean);
  let host='github.com';
  if(parts.length>=3&&parts[0].includes('.')) host=parts.shift().toLowerCase();
  else if(parts.length>=1&&parts[0].includes('.')) return null;
  if(parts.length<2) return null;
  const [owner,name]=parts;
  const api=host==='github.com'||host==='www.github.com'?'https://api.github.com/graphql':`https://${host}/api/graphql`;
  return {host,owner,name,full:owner+'/'+name,api};
}

const gqlWarnings=new Set();
async function gql(api,token,query,variables){
  let r;
  try{
    r=await fetch(api,{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({query,variables})});
  }catch(e){
    throw new Error(`Cannot reach ${api} (network or CORS error). Check that you are on the company network/VPN. If it still fails, your GitHub Enterprise server is blocking requests from local files — use issue-graph.sh with gh instead.`);
  }
  if(r.status===401) throw new Error('401 – token is invalid or expired (or was created on a different GitHub host).');
  if(r.status===403) throw new Error('403 – insufficient permissions or API rate limit exceeded.');
  if(r.status===404) throw new Error(`404 – no GraphQL API at ${api}. Check the host in the repository URL.`);
  const j=await r.json();
  if(j.errors){
    const msg=j.errors.map(e=>e.message).join('; ');
    const hint=/SAML|SSO/i.test(msg)?' → Authorize the token for your organization’s SSO (GitHub → Settings → Tokens → Configure SSO).':'';
    // Partial data (e.g. a blocker in a repo the token can't read): keep going, remember the warning.
    if(j.data&&j.data.repository){ gqlWarnings.add(msg+hint); return j.data; }
    const err=new Error(msg+hint); err.noDeps=/blockedBy/.test(msg)&&/doesn.t exist|undefinedField/i.test(msg+JSON.stringify(j.errors)); throw err;
  }
  return j.data;
}

let depsSupported=true;
async function fetchIssues(repo,token,onlyOpen){
  let cursor=null; const all=[]; depsSupported=true;
  do{
    let d;
    try{ d=await gql(repo.api,token,buildQuery(depsSupported),{owner:repo.owner,name:repo.name,cursor,states:onlyOpen?['OPEN']:null}); }
    catch(e){
      if(e.noDeps&&depsSupported){ depsSupported=false; continue; } // older GitHub Enterprise Server: no native issue dependencies
      throw e;
    }
    if(!d.repository) throw new Error('Repository not found, or the token has no access to it.');
    const c=d.repository.issues; all.push(...c.nodes);
    cursor=c.pageInfo.hasNextPage?c.pageInfo.endCursor:null;
    setStatus('Fetched '+all.length+' issues…');
  }while(cursor);
  return all;
}

// Reads dependencies written in issue text, e.g.
//   Depends on: [#23](https://host/org/repo/issues/23) (E01-S01), #24, org/repo#25
//   Blocked by #12 and #15        **Zależy od:** #7
// Everything after the keyword up to the end of that line is scanned for issue references
// (#N, [#N](url), issue URLs, owner/repo#N). Returns [{repo|null, num}] — repo null means "this repo".
function parseBody(body){
  const out=new Map();
  const kw=/(?:depends?\s+on|dependencies|blocked\s+by|requires|zależy\s+od|zależności|zablokowane\s+przez)[*_\s]*:?[*_\s]*(.*)$/gim;
  const ref=/https?:\/\/[^\/\s)]+\/([^\/\s)]+)\/([^\/\s)]+)\/(?:issues|pull)\/(\d+)|\b([\w.-]+)\/([\w.-]+)#(\d+)|(?:^|[^\w\/&])#(\d+)\b/g;
  let m;
  while((m=kw.exec(body))){
    const rest=m[1]; let r; ref.lastIndex=0;
    while((r=ref.exec(rest))){
      let repo=null,num;
      if(r[3]){repo=r[1]+'/'+r[2];num=+r[3];}
      else if(r[6]){repo=r[4]+'/'+r[5];num=+r[6];}
      else num=+r[7];
      out.set((repo||'').toLowerCase()+'#'+num,{repo,num});
    }
  }
  return [...out.values()];
}

function esc(s){return String(s).replace(/[\r\n`]/g,' ').replace(/#/g,'#35;').replace(/"/g,'#quot;').replace(/</g,'#lt;').replace(/>/g,'#gt;');}
function trunc(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s;}

function build(issues,repoFull,o){
  const self=repoFull.toLowerCase();
  const keyOf=(repo,num)=>repo.toLowerCase()===self?'I'+num:'X'+repo.replace(/[^a-z0-9]/gi,'_')+'_'+num;
  const nodes=new Map(), edges=new Map();
  for(const is of issues){const k=keyOf(repoFull,is.number);nodes.set(k,{key:k,num:is.number,title:is.title,state:is.state,url:is.url,repo:repoFull,ext:false,assignee:is.assignees.nodes[0]?.login});}
  const addNode=(n,repo)=>{const k=keyOf(repo,n.number);if(!nodes.has(k))nodes.set(k,{key:k,num:n.number,title:n.title,state:n.state,url:n.url,repo,ext:repo.toLowerCase()!==self});return k;};
  for(const is of issues){
    const to=keyOf(repoFull,is.number);
    for(const b of (is.blockedBy?.nodes||[])){if(!b||!b.repository)continue;const from=addNode(b,b.repository.nameWithOwner);edges.set(from+'>'+to,{from,to,text:false});}
    if(o.parseText&&is.body){for(const d of parseBody(is.body)){const from=keyOf(d.repo||repoFull,d.num);if(from===to||!nodes.has(from))continue;const id=from+'>'+to;if(!edges.has(id))edges.set(id,{from,to,text:true});}}
  }
  // statuses are computed on the full graph
  const inE=new Map(),outE=new Map();
  for(const e of edges.values()){(inE.get(e.to)||inE.set(e.to,[]).get(e.to)).push(e);(outE.get(e.from)||outE.set(e.from,[]).get(e.from)).push(e);}
  const isOpen=k=>nodes.get(k)?.state==='OPEN';
  const downstream=k=>{const seen=new Set(),st=[k];while(st.length){const c=st.pop();for(const e of outE.get(c)||[]){if(!seen.has(e.to)&&isOpen(e.to)){seen.add(e.to);st.push(e.to);}}}return seen.size;};
  for(const n of nodes.values()){
    n.openBlockers=(inE.get(n.key)||[]).filter(e=>isOpen(e.from)).map(e=>nodes.get(e.from));
    n.down=n.state==='OPEN'?downstream(n.key):0;
    n.cls=n.state!=='OPEN'?'done':n.openBlockers.length?'blocked':n.down?'ready':'open';
  }
  // view filters
  let keep=new Set(nodes.keys());
  if(o.openOnly) keep=new Set([...keep].filter(isOpen));
  if(o.focus){
    const start=keyOf(repoFull,o.focus);
    if(!nodes.has(start)) throw new Error('Issue #'+o.focus+' is not in the fetched data.');
    const sel=new Set([start]);
    for(const [map,dirKey] of [[outE,'to'],[inE,'from']]){const st=[start];while(st.length){const c=st.pop();for(const e of map.get(c)||[]){const nx=e[dirKey];if(keep.has(nx)&&!sel.has(nx)){sel.add(nx);st.push(nx);}}}}
    keep=sel; o.focusKey=start;
  }
  const vEdges=[...edges.values()].filter(e=>keep.has(e.from)&&keep.has(e.to));
  if(o.linkedOnly){const linked=new Set();vEdges.forEach(e=>{linked.add(e.from);linked.add(e.to);});keep=new Set([...keep].filter(k=>linked.has(k)));}
  return {nodes,keep,vEdges};
}

function toMermaid(g,o){
  const L=['flowchart '+o.dir];
  for(const k of g.keep){
    const n=g.nodes.get(k);
    const words=trunc(n.title,52).split(/\s+/);const lines=[''];
    for(const w of words){const cur=lines[lines.length-1];if(cur&&(cur+' '+w).length>24&&lines.length<2)lines.push(w);else lines[lines.length-1]=cur?cur+' '+w:w;}
    let label='<b>'+esc(n.ext?n.repo+'#'+n.num:'#'+n.num)+'</b> '+lines.map(esc).join('<br/>');
    if(n.assignee) label+='<br/><small>@'+esc(n.assignee)+'</small>';
    L.push(`  ${k}["${label}"]:::${n.cls}${n.ext?'':''}`);
  }
  const mixed=g.vEdges.some(e=>e.text)&&g.vEdges.some(e=>!e.text); // label text-based links only when both kinds are shown
  for(const e of g.vEdges){
    const resolved=g.nodes.get(e.from).state!=='OPEN';
    L.push(`  ${e.from} ${resolved?'-.->':'-->'}${e.text&&mixed?'|from description|':''} ${e.to}`);
  }
  L.push('  classDef blocked fill:#2a0b1a,stroke:#ff3d81,color:#ffd6e5,stroke-width:2px');
  L.push('  classDef ready fill:#261b05,stroke:#fbbf24,color:#fff1c7,stroke-width:2px');
  L.push('  classDef open fill:#0b1a2b,stroke:#38bdf8,color:#d7e7ff');
  L.push('  classDef done fill:#062019,stroke:#34d399,color:#a7f3d0');
  if(o.focusKey&&g.keep.has(o.focusKey)) L.push(`  style ${o.focusKey} stroke-width:4px,stroke:#ffffff`);
  for(const k of g.keep){const n=g.nodes.get(k);if(n.url)L.push(`  click ${k} href "${n.url}" _blank`);}
  return L.join('\n');
}

function link(n){const a=document.createElement('a');a.href=n.url;a.target='_blank';a.rel='noopener';a.textContent=(n.ext?n.repo:'')+'#'+n.num+' '+trunc(n.title,60);return a;}
function lists(g){
  const vis=[...g.keep].map(k=>g.nodes.get(k));
  const blocked=vis.filter(n=>n.cls==='blocked').sort((a,b)=>a.num-b.num);
  const ready=vis.filter(n=>n.cls==='ready').sort((a,b)=>b.down-a.down);
  $('hBlocked').textContent='Blocked ('+blocked.length+')';
  $('hReady').textContent='Do these first ('+ready.length+')';
  const animate=(id,to)=>{const el=$(id);const from=parseInt(el.textContent,10)||0;
    if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to;return;}
    const t0=performance.now();const step=t=>{const p=Math.min(1,(t-t0)/450);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);};
  animate('sIssues',(issuesCache||[]).length);animate('sBlocked',blocked.length);animate('sReady',ready.length);animate('sEdges',g.vEdges.length);
  const fill=(ul,arr,meta)=>{ul.innerHTML='';if(!arr.length){ul.innerHTML='<li class="meta">none</li>';return;}
    for(const n of arr){const li=document.createElement('li');li.appendChild(link(n));const m=document.createElement('div');m.className='meta';m.textContent=meta(n);li.appendChild(m);ul.appendChild(li);}};
  fill($('lBlocked'),blocked,n=>'blocked by: '+n.openBlockers.map(b=>'#'+b.num).join(', '));
  fill($('lReady'),ready,n=>'unblocks (incl. indirectly): '+n.down);
}

function applyZoom(){const svg=$('graph').querySelector('svg');if(!svg)return;const vb=svg.viewBox.baseVal;if(!vb||!vb.width)return;svg.style.maxWidth='none';svg.setAttribute('width',vb.width*zoom);svg.setAttribute('height',vb.height*zoom);}
function fit(full){const svg=$('graph').querySelector('svg');if(!svg)return;const vb=svg.viewBox.baseVal;const g=$('graph');
  let z=Math.min((g.clientWidth-40)/vb.width,(g.clientHeight-40)/vb.height);
  zoom=full?Math.min(1.8,Math.max(0.1,z)):Math.min(1.4,Math.max(0.85,z)); // initial view keeps text readable; Fit shows everything
  applyZoom();}

function opts(){return{dir:$('dir').value,openOnly:$('openOnly').checked,linkedOnly:$('linkedOnly').checked,parseText:$('parseText').checked,focus:parseInt(($('focus').value||'').replace('#',''),10)||null};}

async function draw(){
  for(let i=0;i<50&&!window.mermaid&&!window.__mermaidFailed;i++) await new Promise(r=>setTimeout(r,100)); // wait for CDN / fallback
  if(!window.mermaid) throw new Error('Mermaid library could not be loaded from cdn.jsdelivr.net (blocked network, or the file failed the integrity check). Put mermaid.min.js (v11.17.2) next to this file, or use issue-graph.html, which has Mermaid built in.');
  const o=opts();
  const g=build(issuesCache,repoCache,o);
  lists(g);
  if(!g.keep.size){$('graph').innerHTML='<div class="empty"><div class="radar" aria-hidden="true"></div><div>No dependencies to show with the current filters.</div></div>';$('src').value='';$('dlsvg').disabled=true;return g;}
  const src=toMermaid(g,o); $('src').value=src;
  mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:'base',maxTextSize:2000000,maxEdges:20000,
    flowchart:{htmlLabels:true,useMaxWidth:false,curve:'basis',nodeSpacing:28,rankSpacing:48,padding:12},
    themeVariables:{darkMode:true,background:'transparent',fontFamily:'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace',fontSize:'14px',
      primaryColor:'#0b1a2b',primaryTextColor:'#d7e7ff',primaryBorderColor:'#38bdf8',lineColor:'#22d3ee',textColor:'#d7e7ff',
      edgeLabelBackground:'#0a1222',clusterBkg:'transparent',clusterBorder:'#1e3a5f'}});
  const {svg,bindFunctions}=await mermaid.render('mg'+(++seq),src);
  const el=$('graph'); el.innerHTML=svg; if(bindFunctions)bindFunctions(el);
  fit(); $('dlsvg').disabled=false;
  return g;
}

// --- gh mode: data embedded by the script ---
let embedded=null;
try{embedded=JSON.parse($('embedded').textContent);}catch(e){}
if(embedded&&embedded.pages){
  document.querySelectorAll('.live').forEach(el=>el.style.display='none');
  issuesCache=embedded.pages.flatMap(p=>p.data.repository.issues.nodes);
  repoCache=embedded.repo;
  $('openOnly').checked=!!embedded.openOnly;
  if(embedded.depsSupported===false) $('parseText').checked=true;
  $('redraw').disabled=false;
  const info=`${repoCache} · data from gh, generated ${new Date(embedded.generatedAt).toLocaleString()} · ${issuesCache.length} issues${embedded.openOnly?' (open only)':''}. Re-run the script to refresh.`;
  window.addEventListener('load',async()=>{
    try{const g=await draw();setStatus(info+` On graph: ${g.keep.size} nodes, ${g.vEdges.length} dependencies.`);}
    catch(e){setStatus(e.message||String(e),true);}
  });
}

$('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(embedded&&embedded.pages){$('redraw').click();return;}
  const raw=$('repo').value.trim(); const R=parseRepoInput(raw); const token=$('token').value.trim();
  if(!R){setStatus('Enter the repository as owner/repo or paste its URL (e.g. https://github.example.com/org/repo).',true);return;}
  const repo=R.full;
  store.set('ig.repo',raw); store.set('ig.token',$('remember').checked?token:null);
  ['dir','openOnly','linkedOnly','parseText'].forEach(id=>store.set('ig.'+(id==='parseText'?'parseText2':id),$(id).type==='checkbox'?($(id).checked?'1':'0'):$(id).value));
  $('go').disabled=true;
  try{
    setStatus('Fetching…'); gqlWarnings.clear();
    issuesCache=await fetchIssues(R,token,$('openOnly').checked); repoCache=repo;
    if(!depsSupported) $('parseText').checked=true;
    const g=await draw();
    let warn=gqlWarnings.size?` Some blockers were skipped (no access): ${[...gqlWarnings].join(' | ')}. Add those repositories to the token to include them.`:'';
    if(!depsSupported) warn+=` ${R.host} does not support native issue dependencies yet, so dependencies are read only from “blocked by #N” text in issue descriptions.`;
    setStatus(`${repo}: ${issuesCache.length} issues, ${g.keep.size} nodes and ${g.vEdges.length} dependencies on graph. Refreshed ${new Date().toLocaleTimeString()}.`+warn, !!warn);
    $('redraw').disabled=false;
  }catch(e){setStatus(e.message||String(e),true);}
  finally{$('go').disabled=false;}
});
$('redraw').addEventListener('click',async()=>{
  if(!issuesCache)return;
  try{const g=await draw();setStatus(`${g.keep.size} nodes and ${g.vEdges.length} dependencies on graph.`+($('openOnly').checked?'':' (To include closed issues, fetch again with “open only” unchecked.)'));}
  catch(e){setStatus(e.message||String(e),true);}
});
$('zin').onclick=()=>{zoom=Math.min(4,zoom*1.25);applyZoom();};
$('zout').onclick=()=>{zoom=Math.max(0.1,zoom/1.25);applyZoom();};
$('zfit').onclick=()=>fit(true);
$('graph').addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();zoom=Math.min(4,Math.max(0.1,zoom*(e.deltaY<0?1.1:1/1.1)));applyZoom();},{passive:false});
$('dlsvg').onclick=()=>{const svg=$('graph').querySelector('svg');if(!svg)return;const b=new Blob([svg.outerHTML],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(repoCache.replace('/','_')||'graph')+'-dependencies.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('copy').onclick=async()=>{const t=$('src');try{await navigator.clipboard.writeText(t.value);}catch(e){t.select();document.execCommand('copy');}$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy',1500);};
</script>
